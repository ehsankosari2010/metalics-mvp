<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام | METALICS - پلتفرم ساخت و تامین صنعتی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-gray-50 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-white border border-gray-200 rounded-xl p-8 shadow-sm hover:shadow-md transition">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">METALICS</h1>
            <p class="text-sm text-slate-500 mt-1 font-medium">پلتفرم هوشمند استعلام و ساخت قطعات صنعتی</p>
        </div>

        <div id="auth-error" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg text-sm mb-4"></div>
        <div id="auth-success" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-lg text-sm mb-4"></div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ایمیل سازمانی</label>
                <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">رمز عبور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" id="btn-login" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">ورود به حساب</button>
                <button type="button" id="btn-signup" class="flex-1 bg-gray-100 hover:bg-gray-200 text-slate-700 font-semibold py-2.5 rounded-lg text-sm transition border border-slate-200">ثبت‌نام جدید</button>
            </div>
        </form>
        
        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <span class="text-xs text-slate-400">تامین‌کننده هستید؟ </span>
            <a href="supplier.html" class="text-xs font-semibold text-blue-600 hover:underline">ورود به کارتابل تامین‌کنندگان</a>
        </div>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('auth-error');
        const successDiv = document.getElementById('auth-success');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
        }

        function showSuccess(msg) {
            successDiv.textContent = msg;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        document.getElementById('btn-login').addEventListener('click', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: GAPGPTMASKTOKENeqltrp1wg7qX0X,
            });

            if (error) {
                showError('خطا در ورود: ' + error.message);
            } else {
                showSuccess('ورود موفقیت‌آمیز بود! در حال انتقال...');
                setTimeout(() => window.location.href = 'index.html', 1200);
            }
        });

        document.getElementById('btn-signup').addEventListener('click', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signUp({
                email: emailInput.value,
                password: GAPGPTMASKTOKENeqltrp1wg7qX1X,
            });

            if (error) {
                showError('خطا در ثبت‌نام: ' + error.message);
            } else {
                showSuccess('ثبت‌نام انجام شد. لطفاً ایمیل خود را تایید کنید.');
            }
        });
    </script>
</body>
</html>
