<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام - پلتفرم صنعتی متالیکس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- بارگذاری کلاینت Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-cyan-400 tracking-wider">METALICS</h1>
            <p class="text-sm text-slate-400 mt-1">سامانه جامع استعلام و ساخت صنعتی</p>
        </div>

        <div id="auth-error" class="hidden bg-red-500/10 border border-red-500 text-red-400 p-3 rounded-lg text-sm mb-4"></div>
        <div id="auth-success" class="hidden bg-emerald-500/10 border border-emerald-500 text-emerald-400 p-3 rounded-lg text-sm mb-4"></div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">ایمیل سازمانی / کاربری</label>
                <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">رمز عبور</label>
                <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" id="btn-login" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-lg text-sm transition">ورود</button>
                <button type="button" id="btn-signup" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg text-sm transition">ثبت‌نام</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('auth-error');
        const successDiv = document.getElementById('auth-success');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
        }

        function showSuccess(msg) {
            successDiv.textContent = msg;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        document.getElementById('btn-login').addEventListener('click', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                showError('خطا در ورود: ' + error.message);
            } else {
                showSuccess('ورود موفقیت‌آمیز بود! در حال انتقال...');
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        });

        document.getElementById('btn-signup').addEventListener('click', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                showError('خطا در ثبت‌نام: ' + error.message);
            } else {
                showSuccess('ثبت‌نام انجام شد. لطفاً ایمیل خود را تایید کنید.');
            }
        });
    </script>
</body>
</html>
