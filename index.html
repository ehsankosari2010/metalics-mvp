<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متالیکس | پلتفرم هوشمند B2B قطعات صنعتی و فلزی سفارشی</title>
  
  <!-- Vazirmatn Font (Persian RTL) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Supabase JS v2 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #070d18;
      --card-bg: rgba(16, 26, 46, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      width: 100%;
      max-width: 850px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .brand-title { font-size: 20px; font-weight: 800; color: #60a5fa; letter-spacing: 0.5px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
    .nav-links a:hover { color: #fff; }
    
    .main-card {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
    }
    .form-header { margin-bottom: 24px; text-align: center; }
    .form-header h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #fff; }
    .form-header p { font-size: 14px; color: var(--text-muted); }
    
    .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 680px) { .grid-row { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(8, 14, 26, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: transform 0.15s, filter 0.15s;
      margin-top: 8px;
    }
    .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
    }
    .result-box.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .result-box.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .tracking-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">METALICS | متالیکس</div>
    <div class="nav-links">
      <a href="/admin.html" target="_blank">ورود به پنل کارشناس / ادمین ↗</a>
    </div>
  </header>

  <div class="main-card">
    <div class="form-header">
      <h1>فرم ثبت استعلام ساخت و تأمین قطعات (RFQ)</h1>
      <p>مشخصات فنی قطعه، متریال، برند ورق و نقشه ساخت خود را وارد کنید.</p>
    </div>

    <form id="rfqForm">
      <div class="grid-row">
        <div class="form-group">
          <label>عنوان قطعه یا پروژه *</label>
          <input type="text" id="projectTitle" placeholder="مثال: شاسی دستگاه صنعتی، فلنج سفارشی" required>
        </div>
        <div class="form-group">
          <label>شهر محل تحویل *</label>
          <input type="text" id="city" placeholder="مثال: شیراز، کرمان، تهران" required>
        </div>
      </div>

      <div class="grid-row">
        <div class="form-group">
          <label>جنس متریال (آلیاژ) *</label>
          <select id="material" required>
            <option value="فولاد ساختمانی (St37 / St52)">فولاد ساختمانی (St37 / St52)</option>
            <option value="استنلس استیل (304 / 316)">استنلس استیل (304 / 316)</option>
            <option value="آلومینیوم صنعتی">آلومینیوم صنعتی</option>
            <option value="برنج / مس / فسفر برنز">برنج / مس / فسفر برنز</option>
            <option value="سایر آلیاژها">سایر آلیاژها (قید در توضیحات)</option>
          </select>
        </div>

        <div class="form-group">
          <label>کارخانه / برند متریال (ورق یا مقاطع) *</label>
          <select id="materialBrand" required>
            <option value="فولاد مبارکه اصفهان">فولاد مبارکه اصفهان</option>
            <option value="فولاد اکسین خوزستان (عریض/آلیاژی)">فولاد اکسین خوزستان</option>
            <option value="فولاد کاویان">فولاد کاویان</option>
            <option value="مجتمع فولاد گیلان">فولاد گیلان</option>
            <option value="فولاد سبا">فولاد سبا</option>
            <option value="وارداتی (روس / چین / اروپا)">ورق وارداتی (روس / چین / اروپا)</option>
            <option value="متفرقه / تایید کارشناس متالیکس">متفرقه (طبق تایید متالیکس)</option>
            <option value="مهم نیست / آزاد">مهم نیست / برند آزاد</option>
            <option value="سایر">سایر (ذکر در توضیحات)</option>
          </select>
        </div>
      </div>

      <div class="grid-row">
        <div class="form-group">
          <label>فرآیند ساخت درخواستی *</label>
          <select id="process" required>
            <option value="برش لیزر و خم‌کاری CNC">برش لیزر و خم‌کاری CNC</option>
            <option value="تراشکاری و فرزکاری CNC">تراشکاری و فرزکاری CNC</option>
            <option value="واترجت / پلاسما">واترجت / پلاسما</option>
            <option value="جوشکاری تخصصی و مونتاژ سازه">جوشکاری تخصصی و مونتاژ سازه</option>
            <option value="تولید کامل بر اساس نقشه">تولید کامل بر اساس نقشه فنی</option>
          </select>
        </div>

        <div class="grid-row" style="margin-bottom:0">
          <div class="form-group">
            <label>تعداد قطعه *</label>
            <input type="number" id="quantity" min="1" value="1" required>
          </div>
          <div class="form-group">
            <label>مهلت تحویل (روز)</label>
            <input type="number" id="deliveryDays" min="1" placeholder="مثال: ۱۰">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>فایل نقشه فنی / CAD (اختیاری)</label>
        <input type="file" id="cadFile" accept=".pdf,.dxf,.dwg,.step,.stp,.zip,.rar,.png,.jpg">
      </div>

      <div class="form-group">
        <label>شرح تکمیلی، تلورانس، یا مشخصات خاص برند</label>
        <textarea id="notes" rows="3" placeholder="هرگونه الزامات ابعادی، تست متریال، آنالیز کوانتومتری، یا توضیحات برند را اینجا بنویسید..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">ثبت فوری استعلام و صدور کد رهگیری</button>
    </form>

    <div class="result-box" id="resultBox"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://gndxhgtgnuefmwqdzdss.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZHhoZ3RnbnVlZm13cWR6ZHNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTAwMjUsImV4cCI6MjEwODY4NjAyNX0.BzPBoaCL3jXnx0C5c7CKynt_sme1iLKRWYvCnoUBz80"; // کلید پابلیش شما
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('rfqForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ثبت در شبکه متالیکس...';
      resultBox.style.display = 'none';

      try {
        let uploadedFilePath = null;
        const fileInput = document.getElementById('cadFile');
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
          const { data: uploadData, error: uploadErr } = await client.storage
            .from('rfq-files')
            .upload(fileName, file);

          if (!uploadErr && uploadData) {
            uploadedFilePath = uploadData.path;
          }
        }

        const payload = {
          title: document.getElementById('projectTitle').value.trim(),
          city: document.getElementById('city').value.trim(),
          material: document.getElementById('material').value,
          raw_material_brand: document.getElementById('materialBrand').value,
          process: document.getElementById('process').value,
          quantity: parseInt(document.getElementById('quantity').value) || 1,
          delivery_days: parseInt(document.getElementById('deliveryDays').value) || null,
          notes: document.getElementById('notes').value.trim(),
          files: uploadedFilePath ? [uploadedFilePath] : null,
          status: 'new'
        };

        const { data, error } = await client
          .from('rfqs')
          .insert([payload])
          .select();

        if (error) throw error;

        const inserted = data && data[0];
        const tracking = inserted?.tracking_code || 'در سامانه ثبت شد';

        resultBox.className = 'result-box success';
        resultBox.style.display = 'block';
        resultBox.innerHTML = `
          <strong>استعلام شما با موفقیت ثبت شد!</strong><br>
          کد رهگیری یکتا شما جهت پیگیری:
          <div class="tracking-badge">${tracking}</div>
          <p style="margin-top:8px;font-size:12px;color:#94a3b8">این سفارش مستقیماً در پنل کارشناسی ادمین قابل مشاهده است.</p>
        `;

        form.reset();
      } catch (err) {
        console.error(err);
        resultBox.className = 'result-box error';
        resultBox.style.display = 'block';
        resultBox.textContent = 'خطا در ثبت استعلام: ' + (err.message || 'لطفاً دوباره تلاش کنید.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'ثبت فوری استعلام و صدور کد رهگیری';
      }
    });
  </script>
</body>
</html>
