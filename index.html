<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متالیکس | پلتفرم هوشمند B2B قطعات صنعتی و فلزی سفارشی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { margin: 0; background: #0b1120; color: #f8fafc; line-height: 1.6; }
        header { background: #1e293b; padding: 1.2rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .nav-btns { display: flex; gap: 0.8rem; align-items: center; }
        .btn-link { background: #334155; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; }
        .btn-link:hover { background: #475569; }
        .btn-supplier { background: #0284c7; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; }
        .btn-supplier:hover { background: #0369a1; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #38bdf8; font-size: 1.8rem; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        button.submit-btn { width: 100%; background: #22c55e; color: white; border: none; padding: 0.9rem; font-size: 1.1rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        button.submit-btn:hover { background: #16a34a; }
        #alertBox { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; text-align: center; font-weight: 500; }
        .alert-success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
        .alert-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">METALICS | متالیکس</a>
        <div class="nav-btns">
            <a href="admin.html" class="btn-link">⚙️ پنل ادمین و کارشناس</a>
            <a href="supplier.html" class="btn-supplier">🏭 پنل تولیدکنندگان / تأمین‌کنندگان</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h1>فرم ثبت استعلام ساخت و تأمین قطعات (RFQ)</h1>
            <p class="subtitle">مشخصات فنی قطعه، متریال، برند ورق و نقشه ساخت خود را وارد کنید.</p>

            <form id="rfqForm">
                <div class="form-group">
                    <label>عنوان پروژه / نام قطعه:</label>
                    <input type="text" id="projectTitle" required placeholder="مثلاً ساخت اسکلت فلزی یا قطعه صنعتی CNC">
                </div>

                <div class="form-group">
                    <label>نوع متریال و استاندارد:</label>
                    <select id="materialType">
                        <option value="ST37">فولاد ST37 (معمولی ساختمانی)</option>
                        <option value="ST52">فولاد ST52 (آلیاژی استحکام بالا)</option>
                        <option value="SS304">استنلس استیل 304</option>
                        <option value="Aluminum">آلومینیوم صنعتی</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>تعداد / تناژ مورد نیاز:</label>
                    <input type="text" id="quantity" required placeholder="مثلاً ۵ عدد یا ۲۵ تن">
                </div>

                <div class="form-group">
                    <label>توضیحات تکمیلی و تلورانس‌ها:</label>
                    <textarea id="description" rows="4" placeholder="جزئیات فنی، برشکاری، جوشکاری و دستورالعمل‌های خاص..."></textarea>
                </div>

                <div class="form-group">
                    <label>آپلود فایل نقشه (CAD / PDF / Image):</label>
                    <input type="file" id="rfqFile">
                </div>

                <button type="submit" class="submit-btn">ثبت نهایی استعلام و ارسال به شبکه تولیدکنندگان</button>
            </form>

            <div id="alertBox"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://gndxhgtgnuefmwqdzdss.supabase.co";
        const SUPABASE_ANON_KEY = "GAPGPTMASKTOKENgu6dh0swas8X0X";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('rfqForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.className = '';
            alertBox.textContent = 'در حال ارسال و ثبت استعلام...';
            alertBox.style.background = '#334155';
            alertBox.style.color = '#fff';

            const title = document.getElementById('projectTitle').value;
            const material = document.getElementById('materialType').value;
            const qty = document.getElementById('quantity').value;
            const desc = document.getElementById('description').value;
            const fileInput = document.getElementById('rfqFile');

            let fileUrl = null;
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('rfq-files')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;
                    fileUrl = fileName;
                }

                const trackingCode = 'MTX-' + Math.floor(1000 + Math.random() * 9000);

                const { error: insertError } = await supabaseClient
                    .from('rfqs')
                    .insert([{
                        tracking_code: trackingCode,
                        project_title: title,
                        material_spec: material,
                        quantity: qty,
                        description: desc,
                        file_url: fileUrl,
                        status: 'Pending'
                    }]);

                if (insertError) throw insertError;

                alertBox.className = 'alert-success';
                alertBox.textContent = `استعلام شما با موفقیت ثبت شد! کد رهگیری: ${trackingCode}`;
                document.getElementById('rfqForm').reset();
            } catch (err) {
                alertBox.className = 'alert-error';
                alertBox.textContent = 'خطا در ثبت استعلام: ' + err.message;
            }
        });
    </script>
</body>
</html>
