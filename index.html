<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متالیکس | پلتفرم هوشمند B2B قطعات صنعتی و فلزی سفارشی</title>
  
  <!-- Vazirmatn Font (Persian RTL) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase JS v2 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b1220;
      --card: #0f1a2e;
      --text: #e8eefc;
      --muted: #a9b6d3;
      --border: #23314f;
      --primary: #4f7cff;
      --primary-hover: #3b65e0;
      --danger: #ff5a6a;
      --ok: #26d07c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
    .hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .row { grid-template-columns: 1fr; }
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1730;
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea { min-height: 120px; resize: vertical; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-family: 'Vazirmatn', sans-serif;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.secondary:hover { background: rgba(255,255,255,0.05); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1730;
      font-size: 14px;
      display: none;
    }
    .status-box.ok { border-color: rgba(38, 208, 124, 0.4); color: #26d07c; }
    .status-box.err { border-color: rgba(255, 90, 106, 0.4); color: #ff5a6a; }

    .mono { font-family: ui-monospace, monospace; direction: ltr; text-align: left; }
    
    .auth-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 23, 48, 0.6);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">METALICS / متالیکس</div>
      <div style="font-size: 13px; color: var(--muted);">B2B Industrial Marketplace MVP</div>
    </header>

    <!-- بخش احراز هویت -->
    <div class="auth-bar">
      <div>
        <span style="font-size: 13px; color: var(--muted);">وضعیت حساب: </span>
        <span id="authLabel" class="mono" style="font-weight: 600;">در حال بررسی...</span>
      </div>
      <div>
        <button class="btn secondary" id="btnSignIn" style="padding: 6px 14px; font-size: 13px;" type="button">ورود / ثبت‌نام با ایمیل</button>
        <button class="btn secondary" id="btnSignOut" style="padding: 6px 14px; font-size: 13px; display: none;" type="button">خروج</button>
      </div>
    </div>

    <!-- فرم ثبت استعلام RFQ -->
    <section class="card">
      <h2>ثبت استعلام قطعه سفارشی (RFQ)</h2>
      <div class="hint">مشخصات فنی و نقشه‌های مهندسی خود را جهت ارسال محرمانه به سازندگان واجد شرایط وارد کنید.</div>

      <form id="rfqForm">
        <div class="row">
          <div class="field">
            <label>عنوان قطعه یا پروژه</label>
            <input id="f_title" type="text" placeholder="مثال: فلنج فولادی فورج استنلس استیل" required>
          </div>
          <div class="field">
            <label>فرآیند ساخت</label>
            <select id="f_process" required>
              <option value="">انتخاب فرآیند...</option>
              <option value="cnc">ماشین‌کاری CNC</option>
              <option value="laser">برش لیزر</option>
              <option value="waterjet">واترجت</option>
              <option value="bending">خم‌کاری و پرس</option>
              <option value="welding">جوشکاری و ساخت سازه</option>
              <option value="casting">ریخته‌گری</option>
              <option value="other">سایر</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>متریال / آلیاژ</label>
            <input id="f_material" type="text" placeholder="مثال: St52, 304, Aluminum 6061">
          </div>
          <div class="field">
            <label>تعداد / تیراژ</label>
            <input id="f_qty" type="number" min="1" placeholder="مثال: 50">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>مهلت تحویل مدنظر (روز)</label>
            <input id="f_delivery_days" type="number" min="1" placeholder="مثال: 15">
          </div>
          <div class="field">
            <label>شهر محل تحویل</label>
            <input id="f_city" type="text" placeholder="مثال: شیراز / تهران">
          </div>
        </div>

        <div class="field">
            <label>توضیحات و تلرانس‌های فنی</label>
            <textarea id="f_notes" placeholder="استانداردها، الزامات بازرسی، تست متریال (MTC) و جزئیات نقشه..."></textarea>
            <div class="hint" style="margin-top: 4px;">رعایت قوانین بازار کور (Blind Marketplace): اطلاعات هویتی خریدار درج نشود.</div>
        </div>

        <div class="field">
          <label>پیوست نقشه (PDF / DWG / STEP / ZIP)</label>
          <input id="f_files" type="file" multiple>
        </div>

        <button class="btn" id="btnSubmit" type="submit" disabled>ثبت نهایی استعلام و دریافت کد رهگیری</button>
        
        <div id="submitStatus" class="status-box"></div>
      </form>
    </section>
  </div>

  <script>
    // تنظیمات اتصال به Supabase (لطفاً کلید anon واقعی پروژه خود را جایگزین کنید)
    const SUPABASE_URL = "https://gndxhgtgnuefmwqdzdss.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9lmT4IxeqEix7MmQJd07_A_cYeHr6SI"; // <--- کلید صحیح خود را اینجا بگذارید

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);

    function setStatus(type, html) {
      const el = $("submitStatus");
      if (!el) return;
      el.style.display = "block";
      el.className = "status-box " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
      el.innerHTML = html;
    }

    async function refreshAuthUI() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          $("authLabel").textContent = user.email;
          $("btnSignIn").style.display = "none";
          $("btnSignOut").style.display = "inline-flex";
          $("btnSubmit").disabled = false;
        } else {
          $("authLabel").textContent = "وارد نشده‌اید";
          $("btnSignIn").style.display = "inline-flex";
          $("btnSignOut").style.display = "none";
          $("btnSubmit").disabled = true;
        }
      } catch (err) {
        console.error("Auth status error:", err);
      }
    }

    $("btnSignIn").addEventListener("click", async () => {
      const email = prompt("لطفاً ایمیل خود را برای ورود وارد کنید:");
      if (!email) return;

      try {
        const { error } = await supabase.auth.signInWithOtp({ email });
        if (error) {
          alert("خطا در ورود: " + error.message);
        } else {
          alert("لینک ورود به ایمیل شما ارسال شد! لطفاً صندوق پستی خود را بررسی کنید.");
        }
      } catch (err) {
        alert("خطای سیستمی در ارسال لینک ورود: " + err.message);
      }
    });

    $("btnSignOut").addEventListener("click", async () => {
      await supabase.auth.signOut();
      await refreshAuthUI();
    });

    // ثبت فرم RFQ
    $("rfqForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("لطفاً ابتدا وارد سیستم شوید.");
        return;
      }

      $("btnSubmit").disabled = true;
      setStatus("", "در حال ثبت استعلام و آپلود پیوست‌ها...");

      try {
        const payload = {
          title: $("f_title").value.trim(),
          process: $("f_process").value,
          material: $("f_material").value.trim() || null,
          quantity: $("f_qty").value ? Number($("f_qty").value) : null,
          delivery_days: $("f_delivery_days").value ? Number($("f_delivery_days").value) : null,
          city: $("f_city").value.trim() || null,
          notes: $("f_notes").value.trim() || null,
          customer_user_id: user.id,
          status: "new"
        };

        const { data: rfqRow, error: rfqErr } = await supabase
          .from("rfqs")
          .insert(payload)
          .select("*")
          .single();

        if (rfqErr) throw rfqErr;

        const trackingCode = rfqRow.tracking_code || "MTX-2026-XXXX";

        // آپلود فایل‌ها در باکت rfq-files
        const files = $("f_files").files ? Array.from($("f_files").files) : [];
        for (const file of files) {
          const path = `rfqs/${rfqRow.id}/${Date.now()}-${file.name}`;
          await supabase.storage.from("rfq-files").upload(path, file);
          
          await supabase.from("order_attachments").insert({
            rfq_id: rfqRow.id,
            bucket_id: "rfq-files",
            object_path: path,
            file_name: file.name,
            file_size: file.size,
            uploaded_by: user.id
          });
        }

        setStatus("ok", `
          <strong>استعلام شما با موفقیت ثبت شد!</strong><br>
          کد رهگیری: <span class="mono" style="font-weight:700;">${trackingCode}</span><br>
          شناسه رکورد: <span class="mono">${rfqRow.id}</span>
        `);
        $("rfqForm").reset();

      } catch (err) {
        setStatus("err", "خطا در ثبت استعلام: " + err.message);
      } finally {
        $("btnSubmit").disabled = false;
      }
    });

    supabase.auth.onAuthStateChange(() => refreshAuthUI());
    refreshAuthUI();
  </script>
</body>
</html>
