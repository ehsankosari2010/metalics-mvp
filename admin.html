<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METALICS | Admin & Expert Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { margin: 0; background: #0b0f19; color: #f3f4f6; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #111827; padding: 15px 25px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
        .main-container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #1f2937; font-size: 0.9rem; }
        th { color: #9ca3af; }
        tr:hover { background: #1f2937; cursor: pointer; }
        .btn { background: #38bdf8; color: #0b0f19; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #0ea5e9; }
        .btn.secondary { background: #374151; color: #f3f4f6; }
        .btn.secondary:hover { background: #4b5563; }
        .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1f2937; font-size: 0.9rem; }
        .kv .k { color: #9ca3af; }
        .kv .v { color: #f3f4f6; font-weight: 500; }
        .mono { font-family: monospace; direction: ltr; text-align: left; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>METALICS — Admin & Expert Panel</h1>
            <div style="font-size: 0.8rem; color: #9ca3af; margin-top: 4px;">پنل کارشناسان/ادمین | مدیریت RFQها</div>
        </div>
        <div>
            <button class="btn secondary" onclick="loadRfqs()">رفرش</button>
        </div>
    </header>

    <div class="main-container">
        <!-- جزئیات RFQ انتخابی -->
        <div class="card">
            <h3>جزئیات RFQ</h3>
            <div id="selectedId" style="color: #9ca3af; font-size: 0.85rem; margin-bottom: 15px;">یک RFQ را از لیست انتخاب کن.</div>
            <div id="detailsContent">
                <div style="color: #6b7280; text-align: center; padding: 40px 0;">هنوز موردی انتخاب نشده است.</div>
            </div>
        </div>

        <!-- لیست RFQها -->
        <div class="card">
            <h3>لیست RFQها</h3>
            <div style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 10px;">منبع داده: جدول rfqs در Supabase</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Tracking</th>
                            <th>عنوان</th>
                            <th>شهر</th>
                            <th>وضعیت</th>
                            <th>تاریخ</th>
                        </tr>
                    </thead>
                    <tbody id="rfqTableBody">
                        <tr><td colspan="5" style="text-align: center; color: #9ca3af;">در حال بارگذاری...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // اتصال به Supabase
        const SUPABASE_URL = "https://gndxhgtgnuefmwqdzdss.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZHhoZ3RnbnVlZm13cWR6ZHNzIiwicm9sZSI6ImFub24iLCJpYXQiOjM3MzI5X5V5Yw"; // کلید عمومی شما
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let RFQS_CACHE = [];
        let SELECTED = {};

        function safe(v) { return v ? v : '-'; }
        
        function pickField(obj, keys) {
            for (let k of keys) {
                if (obj[k] !== undefined && obj[k] !== null) return obj[k];
            }
            return null;
        }

        async function loadRfqs() {
            const tbody = document.getElementById('rfqTableBody');
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af;">در حال بارگذاری...</td></tr>`;
            
            try {
                const { data, error } = await supabaseClient
                    .from('rfqs')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                RFQS_CACHE = data || [];
                
                if (RFQS_CACHE.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af;">هیچ استعلامی یافت نشد.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                RFQS_CACHE.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => showDetails(r);
                    tr.innerHTML = `
                        <td class="mono" style="color: #38bdf8; font-weight: bold;">${safe(r.tracking_code || r.id)}</td>
                        <td>${safe(r.title || r.project_title)}</td>
                        <td>${safe(r.city)}</td>
                        <td><span style="padding: 2px 8px; border-radius: 4px; background: #1e3a8a; color: #93c5fd; font-size: 0.8rem;">${safe(r.status || 'new')}</span></td>
                        <td style="font-size: 0.8rem; color: #9ca3af;">${new Date(r.created_at).toLocaleDateString('fa-IR')}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading RFQs:", err);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">خطا در بارگذاری اطلاعات: ${err.message}</td></tr>`;
            }
        }

        function showDetails(r) {
            SELECTED = r;
            document.getElementById('selectedId').textContent = `کد رهگیری: ${r.tracking_code || r.id}`;

            const r_raw = r.raw || {};
            const material = pickField(r_raw, ["material", "mat", "metal", "alloy"]) || r.material;
            const process = pickField(r_raw, ["process", "manufacturing_process", "service", "method"]) || r.process;
            const qty = pickField(r_raw, ["quantity", "qty", "count"]) || r.quantity;
            const delivery = pickField(r_raw, ["delivery_days", "lead_time_days", "delivery"]) || r.delivery_days;
            const notes = pickField(r_raw, ["notes", "description", "details", "reqs"]) || r.notes;
            
            // استخراج فایل‌ها و ساخت لینک دانلود مستقیم
            const filesRaw = pickField(r_raw, ["files", "attachments", "file_paths"]) || r.file_url || r.file_path;
            let fileLink = "فایلی پیوست نشده است";
            
            if (filesRaw) {
                try {
                    let filePath = typeof filesRaw === 'string' ? (filesRaw.startsWith('[') ? JSON.parse(filesRaw)[0] : filesRaw) : filesRaw[0];
                    if (filePath) {
                        const publicUrl = `https://gndxhgtgnuefmwqdzdss.supabase.co/storage/v1/object/public/rfq-files/${filePath}`;
                        fileLink = `<a href="${publicUrl}" target="_blank" style="color: #38bdf8; text-decoration: underline; font-weight: bold;">مشاهده و دانلود فایل نقشه</a>`;
                    }
                } catch (e) {
                    fileLink = `<a href="${filesRaw}" target="_blank" style="color: #38bdf8; text-decoration: underline;">مشاهده فایل</a>`;
                }
            }

            const container = document.getElementById('detailsContent');
            container.innerHTML = `
                <div class="kv"><div class="k">وضعیت</div><div class="v">${safe(r.status)}</div></div>
                <div class="kv"><div class="k">عنوان</div><div class="v">${safe(r.title || r.project_title)}</div></div>
                <div class="kv"><div class="k">شهر</div><div class="v">${safe(r.city)}</div></div>
                <div class="kv"><div class="k">متریال</div><div class="v">${safe(material)}</div></div>
                <div class="kv"><div class="k">فرآیند ساخت</div><div class="v">${safe(process)}</div></div>
                <div class="kv"><div class="k">تیراژ / مقدار</div><div class="v">${safe(qty)}</div></div>
                <div class="kv"><div class="k">زمان تحویل</div><div class="v">${safe(delivery)}</div></div>
                <div class="kv" style="grid-column: 1/-1;"><div class="k">توضیحات</div><div class="v">${safe(notes)}</div></div>
                <div class="kv"><div class="k">فایل پیوست</div><div class="v">${fileLink}</div></div>
            `;
        }

        // بارگذاری اولیه هنگام باز شدن صفحه
        window.onload = loadRfqs;
    </script>
</body>
</html>
